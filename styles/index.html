<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cozy Styles</title>
    <meta name="description" content="Browse the style packs for Cozy Studio." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #14110f;
        --panel: #1d1916;
        --line: #2f2925;
        --text: #efe7de;
        --muted: #a39788;
        --accent: #e0a458;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      a { color: inherit; text-decoration: none; }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 12px 24px;
        background: rgb(20 17 15 / 0.92);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      header .brand { font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
      header .brand span { color: var(--accent); }
      header input {
        flex: 1;
        max-width: 420px;
        margin-left: auto;
        padding: 8px 12px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        font: inherit;
      }
      main { max-width: 1400px; margin: 0 auto; padding: 24px; }
      h1 { margin: 0 0 4px; font-size: 26px; }
      h2 { margin: 32px 0 12px; font-size: 18px; }
      .lead { margin: 0 0 20px; color: var(--muted); max-width: 70ch; }
      .lead a { color: var(--accent); }
      .crumbs { margin-bottom: 12px; color: var(--muted); font-size: 13px; }
      .crumbs a:hover { color: var(--accent); }
      .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      .grid.small { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .card {
        display: block;
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        transition: border-color 0.15s, transform 0.15s;
      }
      .card:hover { border-color: var(--accent); transform: translateY(-2px); }
      .card img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: #0c0a09; }
      .card .body { padding: 10px 12px 12px; }
      .card .title { font-weight: 600; line-height: 1.3; }
      .card .meta { margin-top: 2px; color: var(--muted); font-size: 13px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
      .chips a {
        padding: 4px 10px;
        font-size: 13px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
      }
      .chips a:hover { border-color: var(--accent); }
      .style { display: grid; gap: 24px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
      .style .shots { display: grid; gap: 12px; grid-template-columns: repeat(3, 1fr); }
      .style .shots img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: var(--radius); }
      .style dl { margin: 0; }
      .style dt { margin-top: 14px; color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
      .style dd { margin: 4px 0 0; color: var(--text); }
      .empty { color: var(--muted); }
      @media (max-width: 800px) {
        header { padding: 10px 16px; }
        main { padding: 16px; }
        .style { grid-template-columns: 1fr; }
        .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="../">Cozy <span>Styles</span></a>
      <input id="search" type="search" placeholder="Search styles" aria-label="Search styles" />
    </header>
    <main id="view" aria-live="polite"></main>
    <script>
      const view = document.getElementById('view');
      const searchInput = document.getElementById('search');
      const cache = new Map();
      const load = (url) => {
        if (!cache.has(url)) cache.set(url, fetch(url).then((response) => response.json()));
        return cache.get(url);
      };
      const escape = (value) =>
        String(value).replace(/[&<>"']/g, (char) => `&#${char.charCodeAt(0)};`);
      const image = (src, alt) =>
        src ? `<img src="${escape(src)}" alt="${escape(alt)}" loading="lazy" decoding="async" />` : '<img alt="" />';
      const styleCard = (style, packId, meta) => `
        <a class="card" href="#/style/${escape(packId)}/${escape(style.id)}">
          ${image(style.thumbs ? style.thumbs[0] : style.thumb, style.name)}
          <div class="body"><div class="title">${escape(style.name)}</div>
          ${meta ? `<div class="meta">${escape(meta)}</div>` : ''}</div>
        </a>`;

      async function renderHome() {
        const catalog = await load('data/catalog.json');
        const total = catalog.reduce((sum, pack) => sum + pack.presetCount, 0);
        view.innerHTML = `
          <h1>Style packs</h1>
          <p class="lead">${catalog.length} packs and ${total} styles for <a href="https://github.com/gvastethecreator/cozy-studio">Cozy Studio</a>, the free image studio that runs on your machine. Essentials installs on first start; add the others in Studio under Settings → Styles &amp; workflows.</p>
          <div class="grid">${catalog
            .map(
              (pack) => `
            <a class="card" href="#/pack/${escape(pack.id)}">
              ${image(pack.cover, pack.title)}
              <div class="body"><div class="title">${escape(pack.title)}</div>
              <div class="meta">${pack.presetCount} styles · ${escape(pack.summary)}</div></div>
            </a>`,
            )
            .join('')}</div>`;
      }

      async function renderPack(packId, categoryId) {
        const [catalog, data] = await Promise.all([load('data/catalog.json'), load(`data/${packId}.json`)]);
        const pack = catalog.find((item) => item.id === packId);
        if (!pack) return renderMissing();
        const categories = categoryId
          ? pack.categories.filter((category) => category.id === categoryId)
          : pack.categories;
        view.innerHTML = `
          <div class="crumbs"><a href="#/">Packs</a> / ${escape(pack.title)}</div>
          <h1>${escape(pack.name)}</h1>
          <p class="lead">${escape(pack.description)}</p>
          <div class="chips">${pack.categories
            .map(
              (category) =>
                `<a href="#/pack/${escape(pack.id)}/${escape(category.id)}">${escape(category.name)} (${category.count})</a>`,
            )
            .join('')}</div>
          ${categories
            .map(
              (category) => `
            <h2>${escape(category.name)}</h2>
            <div class="grid small">${data.styles
              .filter((style) => style.categoryId === category.id)
              .map((style) => styleCard(style, pack.id))
              .join('')}</div>`,
            )
            .join('')}`;
      }

      async function renderStyle(packId, styleId) {
        const [catalog, data] = await Promise.all([load('data/catalog.json'), load(`data/${packId}.json`)]);
        const pack = catalog.find((item) => item.id === packId);
        const style = data.styles.find((item) => item.id === styleId);
        if (!pack || !style) return renderMissing();
        const category = pack.categories.find((item) => item.id === style.categoryId);
        view.innerHTML = `
          <div class="crumbs"><a href="#/">Packs</a> / <a href="#/pack/${escape(pack.id)}">${escape(pack.title)}</a>
          / <a href="#/pack/${escape(pack.id)}/${escape(category.id)}">${escape(category.name)}</a></div>
          <h1>${escape(style.name)}</h1>
          <p class="lead">${escape(style.id)} · ${escape(pack.name)}</p>
          <div class="style">
            <div class="shots">${style.thumbs.map((src, index) => image(src, `${style.name} example ${index + 1}`)).join('')}</div>
            <dl>${style.dna.map((section) => `<dt>${escape(section.label)}</dt><dd>${escape(section.text)}</dd>`).join('')}</dl>
          </div>`;
      }

      async function renderSearch(query) {
        const [catalog, index] = await Promise.all([load('data/catalog.json'), load('data/search.json')]);
        const titles = new Map(catalog.map((pack) => [pack.id, pack.title]));
        const words = query.toLowerCase().split(/\s+/).filter(Boolean);
        const matches = index.filter((item) => {
          const text = `${item.name} ${item.category} ${titles.get(item.pack)}`.toLowerCase();
          return words.every((word) => text.includes(word));
        });
        view.innerHTML = `
          <h1>Search</h1>
          <p class="lead">${matches.length} styles match “${escape(query)}”${matches.length > 120 ? ', showing the first 120' : ''}.</p>
          ${matches.length === 0 ? '<p class="empty">Try another word.</p>' : ''}
          <div class="grid small">${matches
            .slice(0, 120)
            .map((item) => styleCard(item, item.pack, `${titles.get(item.pack)} · ${item.category}`))
            .join('')}</div>`;
      }

      function renderMissing() {
        view.innerHTML = '<h1>Not found</h1><p class="lead"><a href="#/">Back to all packs</a></p>';
      }

      async function route() {
        const [kind, first, second] = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
        try {
          if (kind === 'pack' && first) await renderPack(first, second);
          else if (kind === 'style' && first && second) await renderStyle(first, second);
          else if (kind === 'search' && first) await renderSearch(first);
          else await renderHome();
        } catch {
          view.innerHTML = '<h1>Could not load the catalog</h1><p class="lead">Reload the page to try again.</p>';
        }
        if (kind !== 'search') searchInput.value = '';
        else if (document.activeElement !== searchInput) searchInput.value = first ?? '';
        window.scrollTo(0, 0);
      }

      let timer;
      searchInput.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const query = searchInput.value.trim();
          location.hash = query ? `#/search/${encodeURIComponent(query)}` : '#/';
        }, 250);
      });
      window.addEventListener('hashchange', route);
      route();
    </script>
  </body>
</html>
